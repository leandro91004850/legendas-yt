<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Legendas YT</title>
<style>
  :root {
    --sub-size: 26px;
    --bg: #0f0f10; --panel: #18181b; --line: #2a2a2e;
    --text: #ececef; --muted: #9a9aa2; --accent: #ffd54a; --red: #e5322d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
  input, select, button { background: #232327; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font: inherit; }
  input { flex: 1 1 280px; min-width: 200px; }
  input:focus, select:focus { outline: 1px solid #555; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { background: #2d2d33; }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .group { display: flex; gap: 4px; }
  #status, #playerError { flex: 1 1 220px; font-size: 12px; line-height: 1.3; }
  #status { color: var(--muted); }
  #status:empty, #playerError:empty { display: none; }
  #status.err, #playerError { color: #ff7a70; }

  #recent { position: absolute; top: calc(100% + 4px); left: 12px; width: min(560px, calc(100vw - 24px));
    max-height: 70vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #recent[hidden] { display: none; }
  #recent .head { padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .r-item { display: flex; gap: 10px; align-items: center; padding: 8px 12px; cursor: pointer;
    border-bottom: 1px solid #202024; }
  .r-item:hover { background: #1f1f24; }
  .r-item.current { box-shadow: inset 3px 0 var(--accent); }
  .r-thumb { position: relative; flex: none; width: 120px; height: 68px; background: #000;
    border-radius: 4px; overflow: hidden; }
  .r-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .r-thumb i { position: absolute; left: 0; bottom: 0; width: 0; height: 3px; background: var(--red); }
  .r-txt { flex: 1; min-width: 0; }
  .r-title { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .r-meta { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .r-next { color: var(--accent); font-weight: 600; }
  .r-del { flex: none; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%;
    background: none; color: var(--muted); font-size: 20px; line-height: 1; opacity: .45; }
  .r-item:hover .r-del, .r-del:focus-visible { opacity: 1; }
  .r-del:hover { background: #34343b; color: var(--text); }
  .r-empty { padding: 14px 12px; color: var(--muted); }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; min-width: 0; position: relative; background: #000;
    display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; }
  #frame iframe, #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px;
    align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 20px; }
  #empty b { color: var(--text); font-size: 18px; }

  #subs { position: absolute; left: 4%; right: 4%; bottom: 13%; text-align: center;
    pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px;
    --sub-px: var(--sub-size); }
  #subs span { display: inline-block; max-width: 100%; padding: 2px 12px; border-radius: 5px;
    background: rgba(0,0,0,.74); text-shadow: 0 1px 2px #000; }
  #subs span:empty { display: none; }
  #sub-orig { font-size: var(--sub-px); color: #fff; }
  #sub-tr { font-size: calc(var(--sub-px) * .95); color: var(--accent); }
  #empty .when-compact { display: none; }

  aside { width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0; }
  aside .head { padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  #list { flex: 1; overflow-y: auto; }
  .cue { padding: 7px 12px; border-bottom: 1px solid #202024; cursor: pointer; }
  .cue:hover { background: #1f1f24; }
  .cue.active { background: #2a2614; box-shadow: inset 3px 0 var(--accent); }
  .cue .t { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cue .o { margin: 1px 0; }
  .cue .x { color: var(--accent); opacity: .9; }
  .cue .x:empty::before { content: "…"; color: var(--muted); }

  body.no-side aside { display: none; }
  body.fs header, body.fs aside { display: none; }
  #exitfs { display: none; position: absolute; top: 10px; right: 10px; opacity: .35; z-index: 5; }
  #exitfs:hover { opacity: 1; }
  body.fs #exitfs { display: block; }

  /* Janela pequena (abaixo de uns 720×460, o antigo tamanho mínimo): só o vídeo, sem o menu e
     sem a lista de falas; aumentar a janela traz os dois de volta. A legenda sobre o vídeo
     acompanha o tamanho dele (6,5% da altura, no máximo o tamanho escolhido em A−/A+). */
  @media (max-width: 700px), (max-height: 420px) {
    header, aside { display: none; }
    #subs { --sub-px: min(var(--sub-size), max(11px, calc(var(--frame-h, 400px) * .065))); }
    #subs span { padding: 1px 8px; }
    #empty .when-full { display: none; }
    #empty .when-compact { display: block; }
  }
</style>
</head>
<body>
<header>
  <input id="url" placeholder="Cole o link do vídeo do YouTube e tecle Enter" spellcheck="false" autofocus>
  <select id="source" title="Idioma da legenda original">
    <option value="auto">Automático</option>
    <option value="en">Inglês → Português</option>
    <option value="pt">Português → Inglês</option>
  </select>
  <button class="primary" id="open">Abrir</button>
  <button id="recentBtn" title="Vídeos abertos recentemente">Recentes</button>
  <select id="show" title="O que mostrar sobre o vídeo">
    <option value="both">Original + tradução</option>
    <option value="tr">Só tradução</option>
    <option value="orig">Só original</option>
  </select>
  <div class="group">
    <button id="smaller" title="Diminuir legenda">A−</button>
    <button id="bigger" title="Aumentar legenda">A+</button>
  </div>
  <button id="toggleSide" title="Mostrar/ocultar lista de falas">☰</button>
  <button id="fullscreen" title="Tela cheia (com legendas)">⛶</button>
  <span id="playerError"></span>
  <span id="status"></span>
  <div id="recent" hidden>
    <div class="head">Vídeos recentes — clique para continuar de onde parou</div>
    <div id="recentList"></div>
  </div>
</header>

<main>
  <section id="stage">
    <div id="frame">
      <div id="player"></div>
      <div id="empty"><b>Legendas YT</b>
        <span class="when-full">Cole um link do YouTube acima.<br>
          A legenda original e a tradução aparecem sobre o vídeo.</span>
        <span class="when-compact">Aumente a janela para ver o menu.</span></div>
      <div id="subs"><span id="sub-orig"></span><span id="sub-tr"></span></div>
    </div>
    <button id="exitfs">Sair da tela cheia</button>
  </section>
  <aside>
    <div class="head" id="sideHead">Falas do vídeo — clique para pular</div>
    <div id="list"></div>
  </aside>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  let player = null, apiReady = false, pending = null, currentId = null;
  let recent = [], lastProgressAt = 0;
  let autoNext = false, nextHint = null, advancing = false;   // sequência: ver playNext()
  let job = 0, cues = [], tr = [], cur = -1, translatedCount = 0, meta = null;
  let show = 'both', subSize = 26;     // preferências: o Python guarda e devolve em loadPrefs()
  let userScrolledAt = 0, lastFocusAt = 0, lastReq = { key: '', at: 0 };

  // ---------- status ----------
  function setStatusText(msg, err) {
    $('status').textContent = msg || '';
    $('status').title = msg || '';
    $('status').classList.toggle('err', !!err);
  }

  // erro do player fica num lugar próprio: as mensagens da tradução em #status não o apagam.
  // Some quando o vídeo começa a tocar ou quando outro vídeo é aberto.
  function setPlayerError(msg) {
    $('playerError').textContent = msg || '';
    $('playerError').title = msg || '';
  }

  // ---------- player ----------
  window.onYouTubeIframeAPIReady = () => {
    apiReady = true;
    if (pending) playVideo(pending.id, pending.start, pending.autoplay);
  };

  // start: segundo onde começar; autoplay=false só deixa o vídeo pronto, parado
  function playVideo(id, start = 0, autoplay = true) {
    saveProgress(true);                  // guarda onde o vídeo anterior parou
    currentId = id;
    nextHint = null;
    setPlayerError('');
    $('empty').style.display = 'none';
    if (!apiReady) { pending = { id, start, autoplay }; return; }
    pending = null;
    if (player && player.loadVideoById) {
      const v = { videoId: id, startSeconds: start };
      if (autoplay) player.loadVideoById(v); else player.cueVideoById(v);
      return;
    }
    player = new YT.Player('player', {
      width: '100%', height: '100%', videoId: id,
      playerVars: { autoplay: autoplay ? 1 : 0, start: Math.floor(start), rel: 0, fs: 0,
                    cc_load_policy: 0, iv_load_policy: 3, playsinline: 1, origin: location.origin },
      events: {
        onStateChange: e => {
          if (e.data === YT.PlayerState.PLAYING) setPlayerError('');
          if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) saveProgress(true);
          if (e.data === YT.PlayerState.ENDED) playNext();
        },
        onError: e => {
          const msgs = {
            2: 'ID de vídeo inválido.',
            5: 'Erro do player HTML5.',
            100: 'Vídeo removido ou privado.',
            101: 'O dono do vídeo não permite reprodução fora do YouTube.',
            150: 'O dono do vídeo não permite reprodução fora do YouTube.',
            153: 'O YouTube recusou o player incorporado (erro 153).',
          };
          const msg = msgs[e.data] || ('Erro do player: ' + e.data);
          // na sequência automática, um vídeo que não toca não trava a fila: pula para o próximo
          if (autoNext && nextAfterCurrent()) {
            setPlayerError(msg + ' Indo para o próximo…');
            const from = currentId;
            setTimeout(() => { if (currentId === from) playNext(); }, 4000);
          } else setPlayerError(msg);
        },
      },
    });
  }

  // ---------- abrir vídeo ----------
  // opts.start / opts.autoplay / opts.keepPlace: usados ao abrir pelo histórico (o vídeo fica no
  // lugar dele na lista); opts.auto: aberto sozinho, porque o anterior terminou
  async function openVideo(opts = {}) {
    const url = $('url').value.trim();
    if (!url) return;
    if (!(window.pywebview && window.pywebview.api)) { setStatusText('Iniciando… tente de novo em 1 s'); return; }
    const key = url + '|' + $('source').value;            // colar + Enter não pede 2 vezes
    if (key === lastReq.key && Date.now() - lastReq.at < 1500) return;
    lastReq = { key, at: Date.now() };
    const r = await window.pywebview.api.load(url, $('source').value, !!opts.keepPlace);
    if (!r.ok) { setStatusText(r.error, true); return; }
    if (r.job > job) { job = r.job; reset(); }
    if (r.videoId !== currentId) {
      autoNext = !!opts.auto;
      playVideo(r.videoId, opts.start || 0, opts.autoplay !== false);
    }
  }

  function reset() {
    cues = []; tr = []; cur = -1; translatedCount = 0; meta = null;
    $('list').innerHTML = '';
    $('sideHead').textContent = 'Falas do vídeo — clique para pular';
    render();
  }

  // ---------- histórico (gravado pelo Python: sobrevive ao fechar o app) ----------
  const hasApi = () => !!(window.pywebview && window.pywebview.api);

  // onde retomar: 3 s antes de onde parou; do começo se mal tinha começado ou se já tinha terminado
  function resumePoint(h) {
    return h.pos > 10 && !(h.dur && h.pos > h.dur - 20) ? Math.max(0, h.pos - 3) : 0;
  }

  // posição do vídeo: a cada 5 s tocando, e na hora em que pausa, termina ou dá lugar a outro vídeo
  function saveProgress(force) {
    if (!player || !player.getPlayerState || !currentId || !hasApi()) return;
    const st = player.getPlayerState();
    const stopped = st === YT.PlayerState.PAUSED || st === YT.PlayerState.ENDED;
    if (st !== YT.PlayerState.PLAYING && !(force && stopped)) return;
    if (!force && Date.now() - lastProgressAt < 5000) return;
    lastProgressAt = Date.now();
    window.pywebview.api.progress(currentId, player.getCurrentTime() || 0, player.getDuration() || 0);
  }
  setInterval(() => saveProgress(false), 1000);

  async function loadRecent() {
    try { recent = hasApi() ? (await window.pywebview.api.history()) || [] : []; } catch { recent = []; }
  }

  function renderRecent() {
    const list = $('recentList');
    list.innerHTML = '';
    if (!recent.length) { list.innerHTML = '<div class="r-empty">Nenhum vídeo na lista.</div>'; return; }
    const upNext = nextAfterCurrent();
    for (const h of recent) {
      const el = document.createElement('div');
      el.className = 'r-item' + (h.id === currentId ? ' current' : '');
      el.innerHTML = '<div class="r-thumb"><img alt="" loading="lazy"><i></i></div>' +
                     '<div class="r-txt"><div class="r-title"></div><div class="r-meta"></div></div>' +
                     '<button class="r-del" title="Remover da lista" aria-label="Remover da lista">×</button>';
      el.querySelector('img').src = `https://i.ytimg.com/vi/${h.id}/mqdefault.jpg`;
      if (h.dur > 0) el.querySelector('i').style.width = Math.min(100, 100 * (h.pos || 0) / h.dur) + '%';
      el.querySelector('.r-title').textContent = h.title || h.url;
      const where = h.pos > 10 && h.dur > 0 ? `parou em ${fmt(h.pos)} de ${fmt(h.dur)}` : '';
      const when = h.at ? new Date(h.at * 1000).toLocaleString('pt-BR',
        { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
      const info = [h.author, where, when].filter(Boolean).join(' · ');
      const meta = el.querySelector('.r-meta');
      if (h === upNext) {                 // toca quando o vídeo atual terminar
        const tag = document.createElement('span');
        tag.className = 'r-next';
        tag.textContent = 'a seguir';
        meta.append(tag, info ? ' · ' + info : '');
      } else meta.textContent = info;
      el.querySelector('.r-del').onclick = e => { e.stopPropagation(); removeRecent(h.id); };
      el.onclick = () => {
        $('recent').hidden = true;
        if (h.id !== currentId) openFromHistory(h, true);
      };
      list.appendChild(el);
    }
  }

  async function toggleRecent() {
    if (!$('recent').hidden) { $('recent').hidden = true; return; }
    await loadRecent();
    renderRecent();
    $('recent').hidden = false;
  }

  // abrir pela lista não tira o vídeo do lugar: quando ele terminar, a sequência segue para o de baixo
  function openFromHistory(h, autoplay, auto = false) {
    $('url').value = h.url;
    $('source').value = h.source || 'auto';
    return openVideo({ start: resumePoint(h), autoplay, keepPlace: true, auto });
  }

  async function removeRecent(id) {
    const i = recent.findIndex(h => h.id === id);
    if (i < 0) return;
    // o vídeo que está tocando (ou o que viria depois dele) saiu da lista: guarda quem vem
    // em seguida, para a sequência continuar dali quando o atual terminar
    if (id === currentId || id === nextHint) nextHint = recent[i + 1] ? recent[i + 1].id : null;
    recent.splice(i, 1);
    renderRecent();
    try { await window.pywebview.api.remove_from_history(id); } catch {}
  }

  // ---------- sequência: quando um vídeo termina, toca o de baixo na lista de recentes ----------
  function nextAfterCurrent() {
    const i = recent.findIndex(h => h.id === currentId);
    if (i >= 0) return recent[i + 1] || null;
    return recent.find(h => h.id === nextHint) || null;    // o atual saiu da lista
  }

  async function playNext() {
    if (advancing || !hasApi()) return;
    advancing = true;
    try {
      await loadRecent();
      const h = nextAfterCurrent();
      if (!h) return;                    // era o último da lista
      await openFromHistory(h, true, true);
      if (!$('recent').hidden) { await loadRecent(); renderRecent(); }
    } finally {
      advancing = false;
    }
  }

  // ---------- chamados pelo Python ----------
  function accept(j) {
    if (j < job) return false;          // resultado de um pedido antigo
    if (j > job) { job = j; reset(); }
    return true;
  }

  const app = {
    setStatus(j, msg, err) { if (j >= job) setStatusText(msg, err); },

    onTranscript(j, m) {
      if (!accept(j)) return;
      meta = m; cues = m.cues; tr = new Array(cues.length).fill(null); translatedCount = 0;
      $('sideHead').textContent = `${m.sourceName}${m.generated ? ' (legenda automática)' : ''} → ${m.targetName} · ${cues.length} falas`;
      buildList();
      cur = -1; tick();
    },

    onTranslations(j, pairs) {
      if (!accept(j)) return;
      const items = $('list').children;
      for (const [i, text] of pairs) {
        if (tr[i] === null) translatedCount++;
        tr[i] = text;
        if (items[i]) items[i].querySelector('.x').textContent = text;
      }
      if (meta && translatedCount < cues.length) {
        setStatusText(`Traduzindo para ${meta.targetName}… ${Math.round(100 * translatedCount / cues.length)}%`);
      }
      render();
    },
  };
  window.app = app;

  // ---------- sincronização ----------
  function fmt(s) {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }

  function lastStarted(t) {               // última fala que começou antes de t
    let lo = 0, hi = cues.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (cues[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  function tick() {
    if (!player || !player.getCurrentTime || !cues.length) return;
    const t = player.getCurrentTime() || 0;
    const last = lastStarted(t);
    const idx = last >= 0 && t <= cues[last].start + cues[last].dur + 0.25 ? last : -1;

    // trecho atual ainda sem tradução? pede ao Python para traduzi-lo primeiro
    const here = Math.max(last, 0);
    if (tr[here] === null && Date.now() - lastFocusAt > 1500 && window.pywebview && window.pywebview.api) {
      lastFocusAt = Date.now();
      window.pywebview.api.focus(job, here);
    }

    if (idx === cur) return;
    const items = $('list').children;
    if (items[cur]) items[cur].classList.remove('active');
    cur = idx;
    if (items[cur]) {
      items[cur].classList.add('active');
      if (Date.now() - userScrolledAt > 4000) items[cur].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    render();
  }
  setInterval(tick, 100);

  function render() {
    const c = cues[cur];
    const orig = c ? c.text : '';
    const trans = c ? (tr[cur] ?? '…') : '';
    $('sub-orig').textContent = show === 'tr' ? '' : orig;
    $('sub-tr').textContent = show === 'orig' ? '' : trans;
  }

  function buildList() {
    const frag = document.createDocumentFragment();
    cues.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'cue';
      el.innerHTML = '<div class="t"></div><div class="o"></div><div class="x"></div>';
      el.querySelector('.t').textContent = fmt(c.start);
      el.querySelector('.o').textContent = c.text;
      el.querySelector('.x').textContent = tr[i] ?? '';
      el.onclick = () => { if (player && player.seekTo) { player.seekTo(c.start, true); player.playVideo(); } };
      frag.appendChild(el);
    });
    $('list').innerHTML = '';
    $('list').appendChild(frag);
  }

  // ---------- layout 16:9 ----------
  function fit() {
    const s = $('stage'), W = s.clientWidth, H = s.clientHeight;
    let w = W, h = W * 9 / 16;
    if (h > H) { h = H; w = H * 16 / 9; }
    $('frame').style.width = w + 'px';
    $('frame').style.height = h + 'px';
    $('frame').style.setProperty('--frame-h', h + 'px');   // a legenda acompanha o vídeo na janela pequena
  }
  new ResizeObserver(fit).observe($('stage'));
  fit();

  // ---------- controles ----------
  function applySize() {
    document.documentElement.style.setProperty('--sub-size', subSize + 'px');
  }
  applySize();
  $('show').value = show;

  // preferências ficam num arquivo (o localStorage é apagado ao fechar: o WebView roda em modo privado)
  function savePref(key, value) { if (hasApi()) window.pywebview.api.set_pref(key, value); }

  async function loadPrefs() {
    let p = {};
    try { p = (await window.pywebview.api.prefs()) || {}; } catch {}
    if (Number.isInteger(p.subSize)) { subSize = Math.min(64, Math.max(14, p.subSize)); applySize(); }
    if (['both', 'tr', 'orig'].includes(p.show)) { show = p.show; $('show').value = show; render(); }
  }

  $('open').onclick = () => openVideo();
  $('recentBtn').onclick = e => { e.stopPropagation(); toggleRecent(); };
  document.addEventListener('click', e => {
    if (!$('recent').hidden && !$('recent').contains(e.target)) $('recent').hidden = true;
  });
  $('url').addEventListener('keydown', e => { if (e.key === 'Enter') openVideo(); });
  $('url').addEventListener('paste', () => setTimeout(openVideo, 0));
  $('source').onchange = () => { if (currentId) openVideo(); };
  $('show').onchange = e => { show = e.target.value; savePref('show', show); render(); };
  $('smaller').onclick = () => { subSize = Math.max(14, subSize - 2); applySize(); savePref('subSize', subSize); };
  $('bigger').onclick = () => { subSize = Math.min(64, subSize + 2); applySize(); savePref('subSize', subSize); };
  $('toggleSide').onclick = () => document.body.classList.toggle('no-side');
  $('list').addEventListener('wheel', () => { userScrolledAt = Date.now(); }, { passive: true });

  function toggleFs() {
    document.body.classList.toggle('fs');
    if (window.pywebview && window.pywebview.api) window.pywebview.api.toggle_fullscreen();
  }
  $('fullscreen').onclick = toggleFs;
  $('exitfs').onclick = toggleFs;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('recent').hidden = true;
    if (e.key === 'Escape' && document.body.classList.contains('fs')) toggleFs();
    if (e.key === 'F11') { e.preventDefault(); toggleFs(); }
  });

  // vídeo passado pela linha de comando (?u=...); sem ele, reabre o último vídeo assistido, parado
  // onde estava (nem sempre é o do topo: vídeo aberto pela lista fica no lugar dele)
  window.addEventListener('pywebviewready', async () => {
    loadPrefs();
    const u = new URLSearchParams(location.search).get('u');
    if (u) { $('url').value = u; openVideo(); return; }
    await loadRecent();
    const last = recent.reduce((a, h) => ((h.at || 0) > (a.at || 0) ? h : a), recent[0]);
    if (last) openFromHistory(last, false);
  });
})();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
